# Minimal hyprlock config — matches the waybar palette.
general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
    immediate_render = true
    screencopy_mode = 0
    fail_timeout = 2000
}

auth {
    pam:enabled = true
}

animations {
    enabled = true
    animation = fade, 1, 1.0, linear
}

background {
    monitor =
    path = /home/$USER/Pictures/Wallpapers/angkor.jpg
    color = rgba(16, 19, 21, 1.0)
    blur_passes = 1
    blur_size = 7
    noise = 0.0
    brightness = 0.30
    vibrancy = 0.6
    reload_time = -1
    zindex = -1
}

input-field {
    monitor =
    font_family = JetBrainsMono Nerd Font
    size = 10%, 4%
    outline_thickness = 1
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(165, 85, 85, 1.0)
    inner_color = rgba(20, 23, 25, 1.0)
    font_color = rgba(202, 204, 204, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    position = 0, -20
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgba(202, 204, 204, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(107, 113, 115, 1.0)
    position = 0, 60
    halign = center
    valign = center
}
